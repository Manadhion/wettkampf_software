services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: wettkampf
      POSTGRES_USER: wettkampf
      POSTGRES_PASSWORD: wettkampf-lokal
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - wettkampf-postgres-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wettkampf -d wettkampf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  wettkampf-postgres-daten:
